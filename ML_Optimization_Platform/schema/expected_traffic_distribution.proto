syntax = "proto3";

package linkedin.ai.modeloptimization.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// ExpectedTrafficDistribution
//
// Producer:
//   AI / product team that owns the workload, e.g. Feed AI.
//   In practice this artifact may be generated by a traffic-profiling pipeline
//   from historical production telemetry and then reviewed/versioned by the
//   owning team.
//
// Primary consumers:
//   1. Model Optimization / Candidate Search:
//      Uses the expected workload mix to prioritize candidate configurations,
//      estimate likely bottlenecks, and select representative experiments.
//   2. Benchmark Planning / Experiment Execution:
//      Uses the request mix, arrival profile, and optional trace to generate
//      realistic benchmark traffic.
//   3. QualificationController:
//      Uses this exact immutable snapshot when deciding whether measured
//      performance satisfies ServingRequirements for the intended workload.
//   4. Serving Capacity Planning:
//      Can use the expected demand profile as an initial planning input before
//      production observations are available.
//   5. Production Observation / Drift Detection:
//      Compares observed production traffic against the expected distribution
//      that was used to qualify the ServingProfile.
//
// Purpose:
//   Describe the EXPECTED workload distribution against which a candidate
//   ServingProfile should be optimized and qualified.
//
// Lifecycle:
//   Immutable and versioned. An OptimizationJob pins one exact version.
//   Changes in expected workload create a new version. Live production traffic
//   is represented separately as ObservedTrafficDistribution; it never mutates
//   this artifact.
//
// Important boundaries:
//   - This artifact describes workload demand, not serving capacity.
//   - Server-side active concurrency is generally derived from arrival rate
//     and service time, so it is not treated as a primary workload input.
//   - Latency/throughput targets belong to ServingRequirements.
//   - Search budgets/objectives belong to OptimizationPolicy.
//   - v1 is token-oriented for LLM workloads. Additional modality-specific
//     traffic shapes can be added later without changing these semantics.
// ============================================================================
message ExpectedTrafficDistribution {
  // Schema version for backward-compatible decoding.
  // Example: 1
  uint32 schema_version = 1;

  // Stable logical identifier across revisions of this expected workload.
  // Example: "feed-gen-online-traffic"
  string traffic_distribution_id = 2;

  // Immutable revision number.
  // Example: 12
  uint64 version = 3;

  // Model Registry version whose optimization this traffic distribution
  // describes.
  // Example: "registry://feed-ai/feed-gen/versions/42"
  string model_registry_path = 4;

  // Exact ServingRequirements artifact expected to be used with this
  // distribution.
  // Example:
  // "registry://feed-ai/feed-gen/versions/42/serving-requirements/7"
  string serving_requirements_ref = 5;

  // Records how this expected distribution was produced.
  TrafficProvenance provenance = 6;

  // Demand differs fundamentally for online and offline workloads.
  // Exactly one profile should be set.
  oneof demand_profile {
    OnlineArrivalProfile online = 7;
    OfflineBatchDemandProfile offline = 8;
  }

  // Weighted workload segments. Each segment captures correlated request
  // characteristics such as prompt length, output length, streaming behavior,
  // and prefix locality.
  //
  // Validation rule:
  //   sum(segments.request_fraction) == 1.0, within configured tolerance.
  repeated TrafficSegment segments = 9;

  // Optional immutable sampled trace for high-fidelity benchmark replay.
  // The trace should contain only the information required to reproduce
  // workload shape (for example timestamps/token counts/request attributes),
  // after privacy/compliance processing.
  //
  // Example:
  // "traffic-store://feed-gen/expected/v12/sample-1m-requests"
  string representative_trace_ref = 10;
}


// ============================================================================
// TrafficProvenance
//
// Producer:
//   Traffic profiling / forecasting pipeline owned by the AI / product team.
//
// Consumers:
//   Optimization Platform, QualificationController, auditing/debugging tools.
//
// Purpose:
//   Make the assumptions behind the expected workload reproducible and
//   auditable.
//
// Lifecycle:
//   Immutable as part of ExpectedTrafficDistribution.
// ============================================================================
message TrafficProvenance {
  // Describes whether this profile came from real production history,
  // forecasting, synthetic modeling, or a combination.
  TrafficSource source = 1;

  // Beginning of the production-data window used to construct the profile.
  // Leave unset when source is purely synthetic.
  google.protobuf.Timestamp source_window_start = 2;

  // End of the production-data window used to construct the profile.
  // Leave unset when source is purely synthetic.
  google.protobuf.Timestamp source_window_end = 3;

  // Time this immutable profile was generated.
  google.protobuf.Timestamp generated_at = 4;

  // Versioned generator / profiler implementation.
  // Example: "feed-traffic-profiler-v3"
  string generator_version = 5;

  // Optional human-readable forecast identifier or planning scenario.
  // Example: "2026-q4-launch-forecast"
  string forecast_scenario = 6;
}


// ============================================================================
// OnlineArrivalProfile
//
// Producer:
//   AI / product team from telemetry and/or forecast.
//
// Consumers:
//   BenchmarkPlanner, Candidate Search, QualificationController,
//   Serving Capacity Planning.
//
// Purpose:
//   Describe externally imposed online request arrival demand.
//
// Lifecycle:
//   Immutable as part of ExpectedTrafficDistribution.
// ============================================================================
message OnlineArrivalProfile {
  // Normal sustained request rate expected during steady operation.
  // Example: 3500 requests/sec.
  double steady_state_qps = 1;

  // 95th percentile of one-minute request-rate windows.
  // Example: 7000 requests/sec.
  double p95_one_minute_qps = 2;

  // Maximum request rate the system is expected to sustain for the declared
  // peak duration during qualification/capacity planning.
  // Example: 10000 requests/sec.
  double peak_one_minute_qps = 3;

  // Longest expected continuous period near the declared peak rate.
  // Example: 120 seconds.
  google.protobuf.Duration max_expected_peak_duration = 4;

  // Optional observed client-side outstanding-request concurrency.
  //
  // This is a validation/planning signal only. It is intentionally not the
  // server's active-sequence concurrency, which depends on candidate service
  // time and is therefore discovered during benchmarking.
  ConcurrencyDistribution client_concurrency = 5;
}


// ============================================================================
// OfflineBatchDemandProfile
//
// Producer:
//   AI / product team.
//
// Consumers:
//   Candidate Search, BenchmarkPlanner, Offline Capacity Planning.
//
// Purpose:
//   Describe expected batch-volume demand without turning completion-time SLOs
//   into traffic properties.
//
// Lifecycle:
//   Immutable as part of ExpectedTrafficDistribution.
// ============================================================================
message OfflineBatchDemandProfile {
  // Typical number of independent inference records in one batch job.
  // Example: 500000000
  uint64 records_per_job = 1;

  // Expected number of such jobs submitted per day.
  // Example: 4
  double jobs_per_day = 2;

  // Approximate total input-token volume of one representative job.
  // Example: 750000000000
  uint64 input_tokens_per_job = 3;

  // Approximate total generated-output token volume of one representative job.
  // Example: 25000000000
  uint64 output_tokens_per_job = 4;

  // Expected number of independent batch jobs that may be active at once.
  // Example: 3
  uint32 concurrent_jobs = 5;
}


// ============================================================================
// TrafficSegment
//
// Producer:
//   Traffic profiling / forecasting pipeline.
//
// Consumers:
//   Candidate Search, benchmark workload generator, QualificationController.
//
// Purpose:
//   Preserve important correlations between request characteristics.
//   For example, long-context requests may have a different output-length
//   distribution and prefix-reuse behavior than short interactive requests.
//
// Lifecycle:
//   Immutable as part of ExpectedTrafficDistribution.
// ============================================================================
message TrafficSegment {
  // Stable name within this distribution.
  // Example: "long_context"
  string name = 1;

  // Fraction of all requests/records belonging to this segment.
  // Range: [0.0, 1.0].
  // Example: 0.10
  double request_fraction = 2;

  // Input/prompt token-count distribution for requests in this segment.
  TokenCountDistribution input_tokens = 3;

  // Generated-output token-count distribution for requests in this segment.
  // For embedding/classification workloads this may be omitted.
  TokenCountDistribution output_tokens = 4;

  // Fraction of requests in this segment that use streaming responses.
  // Range: [0.0, 1.0].
  // Example: 1.0
  double streaming_fraction = 5;

  // Prefix-cache locality expected within this segment.
  // Leave unset when prefix reuse is not applicable.
  PrefixReuseProfile prefix_reuse = 6;

  // Optional service class associated with this segment.
  // Useful when qualification needs to preserve different interactive/async
  // traffic mixes.
  RequestServiceClass service_class = 7;
}


// ============================================================================
// TokenCountDistribution
//
// Producer:
//   Traffic profiling / forecasting pipeline.
//
// Consumers:
//   Benchmark workload generator, search heuristics, qualification.
//
// Purpose:
//   Represent token lengths with enough fidelity for performance-sensitive
//   optimization. Percentiles alone are insufficient because LLM cost is
//   highly nonlinear with sequence length.
//
// Lifecycle:
//   Immutable as part of a TrafficSegment.
// ============================================================================
message TokenCountDistribution {
  // Explicitly bounded histogram buckets.
  //
  // Each bucket is a CLOSED integer interval:
  //   [min_tokens, max_tokens]
  //
  // Example:
  //   [16385, 32768] with probability 0.35
  //   [32769, 65536] with probability 0.40
  //   [65537, 131072] with probability 0.25
  //
  // Validation rules:
  //   - min_tokens <= max_tokens for every bucket.
  //   - buckets must not overlap.
  //   - sum(buckets.probability) == 1.0, within configured tolerance.
  //   - gaps are allowed only when the producer intentionally declares that
  //     some token lengths do not occur in this segment.
  repeated TokenCountBucket buckets = 1;
}


// ============================================================================
// TokenCountBucket
//
// Producer:
//   Embedded by traffic profiling.
//
// Consumers:
//   Benchmark workload generator.
//
// Purpose:
//   One explicitly bounded probability bucket in a token-count histogram.
//
// Lifecycle:
//   Immutable as part of TokenCountDistribution.
// ============================================================================
message TokenCountBucket {
  // Inclusive lower token-count bound for this bucket.
  // Example: 16385
  uint32 min_tokens = 1;

  // Inclusive upper token-count bound for this bucket.
  // Example: 32768
  uint32 max_tokens = 2;

  // Probability mass inside [min_tokens, max_tokens].
  // Range: [0.0, 1.0].
  // Example: 0.35
  double probability = 3;
}


// ============================================================================
// PrefixReuseProfile
//
// Producer:
//   Traffic profiling pipeline.
//
// Consumers:
//   Candidate Search and benchmark workload generation.
//
// Purpose:
//   Capture enough temporal/locality information to evaluate prefix caching.
//   Merely knowing prompt length is insufficient to estimate prefix-cache
//   benefit.
//
// Lifecycle:
//   Immutable as part of a TrafficSegment.
// ============================================================================
message PrefixReuseProfile {
  // Fraction of requests in this segment expected to share a reusable prefix.
  // Range: [0.0, 1.0].
  // Example: 0.40
  double reusable_request_fraction = 1;

  // Distribution of reusable prefix lengths.
  TokenCountDistribution shared_prefix_tokens = 2;

  // Average number of requests expected to reuse the same cached prefix before
  // it becomes cold/irrelevant.
  // Example: 6.5
  double average_reuses_per_prefix = 3;

  // Typical time window within which those reuses occur.
  // Example: 30 seconds.
  google.protobuf.Duration typical_reuse_window = 4;
}


// ============================================================================
// ConcurrencyDistribution
//
// Producer:
//   Traffic profiling pipeline.
//
// Consumers:
//   BenchmarkPlanner and Serving Capacity Planning.
//
// Purpose:
//   Optional client-side outstanding-request distribution. This is NOT a
//   declaration of server active-sequence capacity.
//
// Lifecycle:
//   Immutable as part of OnlineArrivalProfile.
// ============================================================================
message ConcurrencyDistribution {
  // Median client-side outstanding requests.
  // Example: 1200
  uint32 p50 = 1;

  // 95th percentile client-side outstanding requests.
  // Example: 2800
  uint32 p95 = 2;

  // 99th percentile client-side outstanding requests.
  // Example: 3900
  uint32 p99 = 3;
}


// ============================================================================
// TrafficSource
// ============================================================================
enum TrafficSource {
  TRAFFIC_SOURCE_UNSPECIFIED = 0;

  // Directly summarized from historical production telemetry.
  HISTORICAL = 1;

  // Product/team forecast without historical weighting.
  FORECAST = 2;

  // Historical workload adjusted by a future-demand forecast.
  HISTORICAL_FORECAST = 3;

  // Fully synthetic workload definition.
  SYNTHETIC = 4;
}


// ============================================================================
// RequestServiceClass
// ============================================================================
enum RequestServiceClass {
  REQUEST_SERVICE_CLASS_UNSPECIFIED = 0;

  CRITICAL_INTERACTIVE = 1;
  INTERACTIVE = 2;
  ASYNC = 3;
  BATCH = 4;
}
